name: arista-bgp-vrf-snmp

mgmt:
  network: clab-bgp-vrf-snmp-mgmt
  ipv4-subnet: 172.20.30.0/24

topology:
  kinds:
    arista_ceos:
      image: ceos:4.35.2F
    linux:
      image: ghcr.io/hellt/network-multitool:latest

  nodes:
    r1:
      kind: arista_ceos
      mgmt-ipv4: 172.20.30.11
      startup-config: configs/r1.cfg
      group: arista
      ports:
        - 2211:22/tcp
        - 8011:80/tcp
        - 44311:443/tcp
        - 11611:161/udp

    r2:
      kind: arista_ceos
      mgmt-ipv4: 172.20.30.12
      startup-config: configs/r2.cfg
      group: arista
      ports:
        - 2212:22/tcp
        - 8012:80/tcp
        - 44312:443/tcp
        - 11612:161/udp

    poller:
      kind: linux
      mgmt-ipv4: 172.20.30.100
      exec:
        - sh -lc 'command -v snmpwalk >/dev/null 2>&1 || (apk update && apk add net-snmp-tools)'
        - ip link set eth1 up
        - ip link set eth2 up
        - ip link set eth3 up
        - ip link set eth4 up
        - ip addr add 10.10.101.100/24 dev eth1
        - ip addr add 10.10.102.100/24 dev eth2
        - ip addr add 10.20.101.100/24 dev eth3
        - ip addr add 10.20.102.100/24 dev eth4
      group: tools

  links:
    # BLUE VRF BGP peering
    - endpoints: ["r1:eth1", "r2:eth1"]

    # GREEN VRF BGP peering
    - endpoints: ["r1:eth2", "r2:eth2"]

    # RED VRF BGP peering
    - endpoints: ["r1:eth5", "r2:eth5"]

    # Poller links for plain SNMPv2c polling inside each VRF
    - endpoints: ["poller:eth1", "r1:eth3"]
    - endpoints: ["poller:eth2", "r2:eth3"]
    - endpoints: ["poller:eth3", "r1:eth4"]
    - endpoints: ["poller:eth4", "r2:eth4"]
