!
! r1 - Arista cEOS BGP per-VRF SNMP lab
!
service routing protocols model multi-agent
hostname r1
username admin privilege 15 secret 0 admin
aaa authorization exec default local
!
vrf instance MGMT
vrf instance BLUE
vrf instance GREEN
vrf instance RED
!
ip routing
ip routing vrf MGMT
ip routing vrf BLUE
ip routing vrf GREEN
ip routing vrf RED
!
interface Management0
   vrf MGMT
   ip address 172.20.30.11/24
   no shutdown
!
ip route vrf MGMT 0.0.0.0/0 172.20.30.1
!
interface Ethernet1
   description r1-to-r2 BLUE VRF
   no switchport
   vrf BLUE
   ip address 10.10.12.1/30
   no shutdown
!
interface Ethernet2
   description r1-to-r2 GREEN VRF
   no switchport
   vrf GREEN
   ip address 10.20.12.1/30
   no shutdown
!
interface Ethernet3
   description poller-to-r1 BLUE VRF SNMP
   no switchport
   vrf BLUE
   ip address 10.10.101.1/24
   no shutdown
!
interface Ethernet4
   description poller-to-r1 GREEN VRF SNMP
   no switchport
   vrf GREEN
   ip address 10.20.101.1/24
   no shutdown
!
interface Ethernet5
   description r1-to-r2 RED VRF
   no switchport
   vrf RED
   ip address 10.30.12.1/30
   no shutdown
!
interface Loopback10
   description BLUE service prefix
   vrf BLUE
   ip address 10.10.1.1/32
!
interface Loopback20
   description GREEN service prefix
   vrf GREEN
   ip address 10.20.1.1/32
!
interface Loopback30
   description RED service prefix
   vrf RED
   ip address 10.30.1.1/32
!
! SNMP is enabled in MGMT, BLUE, GREEN, and RED.
! Plain -c lab polling works for SNMP transport in each VRF.
! Arista per-VRF BGP MIB data still requires SNMPv2c context communities.
snmp-server vrf MGMT
snmp-server vrf BLUE
snmp-server vrf GREEN
snmp-server vrf RED
snmp-server community lab ro
!
router bgp 65101
   vrf BLUE
      router-id 10.10.1.1
      neighbor 10.10.12.2 remote-as 65102
      neighbor 10.10.12.2 description r2 BLUE
      !
      address-family ipv4
         neighbor 10.10.12.2 activate
         network 10.10.1.1/32
   !
   vrf GREEN
      router-id 10.20.1.1
      neighbor 10.20.12.2 remote-as 65102
      neighbor 10.20.12.2 description r2 GREEN
      !
      address-family ipv4
         neighbor 10.20.12.2 activate
         network 10.20.1.1/32
   !
   vrf RED
      router-id 10.30.1.1
      neighbor 10.30.12.2 remote-as 65102
      neighbor 10.30.12.2 description r2 RED
      !
      address-family ipv4
         neighbor 10.30.12.2 activate
         network 10.30.1.1/32
!
management api http-commands
   protocol http
   no shutdown
   !
   vrf MGMT
      no shutdown
!
end
